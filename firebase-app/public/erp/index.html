<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dheeraj Wholesale ERP</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#20352d;background:#f3f5f1;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#173d30;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:21px}header small{display:block;color:#c3d8cb;margin-top:4px}button,a,input,select,textarea{font:inherit}button{border:1px solid #c4d2c7;border-radius:6px;background:#fff;color:#244b38;padding:10px 14px;cursor:pointer;min-height:42px}button.primary,nav button.active{background:#226344;color:#fff;border-color:#226344}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b9862b;outline-offset:2px}nav{display:flex;gap:6px;padding:10px 16px;background:white;overflow:auto;border-bottom:1px solid #dbe3da;position:sticky;top:0;z-index:3}nav button{white-space:nowrap;border:0;font-size:14px}main{max-width:1300px;margin:auto;padding:24px 18px 60px}h1{font-size:29px;letter-spacing:-.04em;margin:0 0 18px}h2{font-size:19px;margin:0 0 14px}.panel,form{background:white;border:1px solid #dce4da;border-radius:10px;padding:18px;margin:16px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:16px 0}label{display:grid;gap:6px;font-size:13px;font-weight:600}input,select,textarea{width:100%;min-width:0;border:1px solid #b9cabb;border-radius:5px;padding:10px;background:#fff;color:inherit;min-height:42px}textarea{min-height:75px}section+section{margin-top:20px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th{font-size:12px;background:#edf3ec;color:#496252}td,th{padding:10px 8px;border-bottom:1px solid #e2e8de;vertical-align:top}td input{min-width:88px}td select{min-width:100px}.bill td:first-child select{min-width:210px}.bill input{padding:8px}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.totals{margin:18px 0 18px auto;max-width:340px}.totals p{display:flex;justify-content:space-between}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{background:white;border:1px solid #dce4da;border-radius:9px;padding:16px;color:#506554}.metric strong{display:block;font-size:25px;color:#183c2b;margin-top:6px}.muted,small{color:#5e7062}.empty{padding:15px;color:#5e7062}#message{position:sticky;top:65px;z-index:4;background:#fff3d7;border-radius:6px;padding:12px;margin-bottom:15px;white-space:pre-wrap}#message:empty{display:none}[hidden]{display:none!important}.actions{margin-top:20px;border-top:1px solid #dce4da;padding-top:16px;display:flex;gap:10px}.login{max-width:420px;margin:50px auto}.pill{font-size:12px;border-radius:20px;background:#e5eee1;padding:5px 9px;display:inline-block}dialog{border:0;border-radius:12px;max-width:560px;width:calc(100% - 24px);padding:24px;box-shadow:0 15px 70px #0004}dialog::backdrop{background:#102a2370}.brand-image{max-width:140px;max-height:70px;object-fit:contain}.signature{max-width:140px;max-height:65px}.invoice{max-width:900px;margin:0 auto}.invoice header{background:white;color:inherit;border-bottom:3px solid #193e2b;padding:0 0 20px}.invoice td,.invoice th{border:1px solid #bcc8ba}.invoice footer{text-align:right;margin-top:25px}@media(max-width:700px){header{padding:14px}header strong{font-size:18px}main{padding:18px 12px}nav{padding:7px;position:sticky}.fields{grid-template-columns:1fr 1fr;gap:10px}.fields .wide{grid-column:1/-1}input,select,textarea{font-size:16px}.panel,form{padding:13px}h1{font-size:25px}.metrics{grid-template-columns:1fr 1fr}.bill{min-width:900px}.mobile-editor{display:block}.actions .primary{flex:1}.invoice .scroll{overflow:auto}}@media(min-width:701px){.mobile-editor{display:none}}@media print{body{background:white}body>header,nav,#message,.no-print,dialog{display:none!important}main{padding:0;max-width:none}.panel{border:0;padding:0}.invoice{max-width:none}.invoice .scroll{overflow:visible}table{font-size:10px}td,th{padding:6px}}

.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.menu-tile{text-align:left;white-space:normal;padding:20px;border-radius:10px}
.menu-tile strong{display:block;font-size:18px;margin-bottom:8px}
.menu-tile span{display:block;color:#5e7062;line-height:1.5}
.setup{border-left:4px solid #397a53}
.setup ol{padding:0;list-style:none;counter-reset:steps}
.setup li{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #e2e8de;counter-increment:steps}
.setup li:before{content:counter(steps);border-radius:50%;padding:6px 11px;background:#edf3ec}
.setup li div{flex:1}.setup small{display:block;margin-top:5px}
.daily-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.daily-actions button{padding:17px 10px;font-size:16px}
.close-day{display:flex;gap:18px;align-items:center;justify-content:space-between}
.close-day p{margin-bottom:0;color:#5e7062}
summary{cursor:pointer;padding:4px 0;font-weight:650}
@media(max-width:700px){
 nav{position:fixed;inset:auto 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #c4d2c7;z-index:5}
 nav button{font-size:11px;padding:9px 2px;white-space:normal}
 main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
 #message{top:8px}.daily-actions{gap:6px}.daily-actions button{font-size:14px;padding:13px 5px}
 .setup li{flex-wrap:wrap}.setup li button{margin-left:44px}
 .close-day{align-items:flex-start;flex-direction:column}.close-day button{width:100%}
 .page-heading h1{font-size:24px}
}
</style></head>
<body><header><div><strong id="brand">Dheeraj Wholesale</strong><small>Stock, bills and accounts</small></div><button id="logout" hidden>Sign out</button></header><nav id="nav"></nav><main><div id="message" role="status"></div><div id="view"></div></main>
<dialog id="editor"></dialog>
<script type="module" src="./app.mjs"></script>
</body></html>
