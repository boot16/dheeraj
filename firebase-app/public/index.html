*{box-sizing:border-box}body{margin:0;background:#f5f6ef;color:#192c23;font:16px system-ui}header{background:#183a2e;color:white;padding:24px clamp(18px,5vw,64px)}header strong{font-size:24px}header small{display:block;color:#c8ded0;margin-top:5px}nav{display:flex;gap:7px;overflow:auto;padding:14px clamp(18px,5vw,64px);background:#fff}button{cursor:pointer;border:0;border-radius:9px;background:#e5eee4;color:#183a2e;padding:11px 15px;font:inherit;font-weight:650;white-space:nowrap}button.active,button.primary{background:#245841;color:white}main{max-width:1160px;margin:auto;padding:24px 18px}h1{margin:0 0 14px;font-size:clamp(26px,5vw,40px)}h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.panel,form{background:white;border:1px solid #e0e5db;border-radius:14px;padding:16px;margin:12px 0}.metric{display:block;font-size:27px;margin-top:7px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:10px 0 16px}label{display:grid;gap:5px;font-size:14px;font-weight:600}input,select{width:100%;min-width:0;padding:10px;border:1px solid #aab8ab;border-radius:7px;background:white;font:inherit;color:inherit}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.table{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:10px;border-bottom:1px solid #e0e5db;white-space:nowrap}th{background:#eef3eb}#status{min-height:24px;color:#245841;font-weight:600}.muted{color:#53675c}fieldset{border:1px solid #d9e3d8;border-radius:10px;margin:12px 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b47a26;outline-offset:2px}@media print{header,nav,#status,button{display:none}main{padding:0}body{background:white}}

<header><span class="brand-mark" aria-hidden="true">DW</span><div><strong>Dheeraj Wholesale</strong><small>Inventory &amp; accounts</small></div></header>
<nav aria-label="Main navigation"></nav><main><div id="status" role="status"></div><section id="view"></section></main>
<form id="login" class="panel" hidden><h2>Owner sign-in</h2><label>Email<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="primary">Sign in</button></form><script type="module">
'use strict';
let data;
let revision;
let saving = false;
let page = 'Overview', lines = [], invoice = null;
let duePayment=null;
let itemMode='list', savedItemId='', itemReview=null;
let billStep = 'party', paymentDraft = {};
const pages = ['Overview','Orders','Customers','Stock','Purchase','Sale','Payments','Returns','Ledger','Settings'];
const view = document.querySelector('#view');
const status = document.querySelector('#status');
const money = n => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(n/100);
const escape = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const product = (state,id) => state.products.find(p=>p.id===id);
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,collection,getDocFromServer,getDocsFromServer,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {applyCommand,packingDetails} from './domain.mjs';
import {applyOrder,orderAvailability,areaKey} from './orders.mjs';
const configResponse = await fetch('/__/firebase/init.json');
if(!configResponse.ok){
 status.textContent='Firebase Hosting configuration could not be loaded.';
 throw Error('Firebase Hosting configuration unavailable');
}
const app = initializeApp(await configResponse.json());
const auth = getAuth(app);
const db=getFirestore(app);
const workspace=doc(db,'wholesale','main');
const items=collection(workspace,'products');
const journal=collection(workspace,'entries');
const orders=collection(workspace,'orders');
const customers=collection(workspace,'customers');
let editCustomerId='';
let selectedArea='';
const login = document.querySelector('#login');
let pending;
async function send(action,fields){
 if(saving)throw Error('A save is already in progress.');
 const draft={action,page,fields,lines:action==='post'?lines.map(line=>line.fields):[]};
 const key=JSON.stringify(draft);
 if(pending&&pending.key!==key)throw Error('Retry the previous save or reload and check the ledger first.');
 pending ||= {key,id:crypto.randomUUID()};
 saving=true;
 try{
   const receipt=doc(workspace,'commands',pending.id);
   const result=await runTransaction(db,async tx=>{
     const [meta,previous]=await Promise.all([tx.get(workspace),tx.get(receipt)]);
     if(previous.exists())return {entryId:previous.data().entryId};
     if((meta.data()?.revision??0)!==revision)return null;
     const next=structuredClone(data);
     try{
       if(action==='customer'){
         const id=fields.id||receipt.id;
         if(fields.id&&!next.customers.some(row=>row.id===id))throw Error('Customer profile not found.');
         applyOrder(next,auth.currentUser.uid,draft,id,today());
         tx.set(doc(customers,id),next.customers.find(row=>row.id===id));
       }else if(['order','dispatch','delivered'].includes(action)){
         const id=action==='order'?receipt.id:fields.order;
         applyOrder(next,auth.currentUser.uid,draft,id,today());
         tx.set(doc(orders,id),next.orders.find(row=>row.id===id));
       }else applyCommand(next,auth.currentUser.uid,draft);
     }
     catch(error){error.invalidDraft=true;throw error}
     const originals=new Map(data.products.map(item=>[item.id,JSON.stringify(item)]));
     for(const item of next.products){
       if(originals.get(item.id)!==JSON.stringify(item))tx.set(doc(items,item.id),item);
     }
     const entry=next.entries[data.entries.length];
     const entryId=entry?.id??null;
     if(entry)tx.set(doc(journal,String(entryId)),entry);
     tx.set(workspace,{revision:revision+1,shop:next.shop,next:next.next,lastCommand:receipt.id});
     tx.set(receipt,{entryId});
     return {entryId};
   });
   if(!result)pending=null;
   await loadState();
   pending=null;
   if(!result){
     render();
     throw Error('Another device saved changes. Review the updated stock and bill before retrying.');
   }
   return result.entryId;
 }catch(error){
   if(error.invalidDraft||error.code==='permission-denied')pending=null;
   throw error;
 }finally{saving=false}
}
async function loadState(){
 for(let attempt=0;attempt<4;attempt++){
   const before=(await getDocFromServer(workspace)).data();
   const [products,entries,orderDocs,customerDocs]=await Promise.all([getDocsFromServer(items),getDocsFromServer(journal),getDocsFromServer(orders),getDocsFromServer(customers)]);
   const after=(await getDocFromServer(workspace)).data();
   if((before?.revision??0)!==(after?.revision??0))continue;
   revision=after?.revision??0;
   data={
     products:products.docs.map(item=>item.data()),
     orders:orderDocs.docs.map(item=>item.data()),
     customers:customerDocs.docs.map(item=>item.data()),
     entries:entries.docs.map(item=>item.data()).sort((a,b)=>a.id-b.id),
     next:after?.next??1,
     shop:after?.shop??{name:'Dheeraj Wholesale',gstin:'',address:''}
   };
   return;
 }
 throw Error('Shop records are changing. Try again.');
}
login.addEventListener('submit',async event=>{
 event.preventDefault();
 const form=new FormData(login);
 try{await signInWithEmailAndPassword(auth,form.get('email'),form.get('password'));login.reset()}
 catch{status.textContent='Sign-in failed. Check your email and password.'}
});
onAuthStateChanged(auth,async user=>{
 login.hidden=!!user;
 document.querySelector('nav').innerHTML='';
 view.innerHTML='';
 status.textContent='';
 if(!user){data=undefined;duePayment=null;pending=null;lines=[];invoice=null;billStep='party';paymentDraft={};page='Overview';return}
 try{await loadState();render()}
 catch(error){status.textContent=error.message;await signOut(auth);status.textContent=error.message}
});
const pageInfo={
 Customers:['Customers','Manage customer names, delivery addresses and areas.'],
 Orders:['Areas & orders','Take orders, check shortages, and track deliveries by area.'],
 Overview:['Today','See today’s sales, money received and customer dues.'],
 Sale:['Make a sale','Add the goods going out. Review the bill before recording payment.'],
 Purchase:['Receive stock','Enter the products and quantities delivered by your supplier.'],
 Stock:['Stock on hand','Find a product to check how many cartons and loose units are available.'],
 Payments:['Record money','Record customer collections, supplier payments or shop expenses.'],
 Returns:['Returns & losses','Put sellable returns back into stock or record goods that can’t be sold.'],
 Ledger:['Dues','See who owes money and review earlier transactions.'],
 Settings:['Shop settings','Update the business details shown on invoices.']
};
const primaryPages=['Overview','Orders','Stock','Ledger'];
function go(name){
 if(name===page&&!invoice)return;
 if(name!==page&&lines.length&&!confirm('Leave this page and discard the unsaved bill?'))return;
 page=name;itemMode='list';savedItemId='';itemReview=null;editCustomerId='';duePayment=null;lines=[];invoice=null;billStep='party';paymentDraft={};status.textContent='';render();
 window.scrollTo(0,0);
}
function table(headers,rows){
 if(!rows.length)return '<p class="empty">No records yet.</p>';
 return '<div class="table"><table role="table"><thead><tr>'+headers.map(h=>'<th>'+escape(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((v,i)=>'<td data-label="'+escape(headers[i])+'">'+escape(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function input(label,name,type='text',extra=''){
 return '<label>'+label+'<input name="'+name+'" type="'+type+'" '+extra+'></label>';
}
const required = 'required maxlength="120"';
const whole = 'required min="0" max="100000" step="1" value="0"';
const rupees = 'required min="0" max="1000000" step=".01" value="0"';
function select(label,name,options){
 return '<label>'+label+'<select name="'+name+'">'+options.map(([v,t])=>'<option value="'+escape(v)+'">'+escape(t)+'</option>').join('')+'</select></label>';
}
function productFields(){
 return input('Item name, flavour and size','name','text',required)+
 input('Smallest stock unit (pouch, bottle, piece)','unit','text','required maxlength="30" value="piece"')+
 input('MRP per smallest unit ₹','mrp','number',rupees)+
 input('Selling rate per smallest unit ₹','loose','number',rupees)+
 '<div style="grid-column:1/-1" data-packing><p>Add packs from smallest to largest. Example: strip = 10 pouches, carton = 12 strips.</p><div data-levels></div><button type="button" data-add-pack>Add packing level</button><input type="hidden" name="packing" value="[]"><input type="hidden" name="pack" value="1"><p data-conversion aria-live="polite">Individual units only</p></div>'+
 input('Selling rate per outermost pack ₹','carton','number',rupees)+
 input('Barcode (optional)','barcode','text','maxlength="64"')+
 input('HSN','hsn','text','maxlength="8" pattern="[0-9]{4,8}"')+
 input('GST %','tax','number','required min="0" max="100" step=".01" value="0"');
}
function syncPacking(form){
 const holder=form.querySelector('[data-packing]');
 if(!holder)return;
 const levels=[...holder.querySelectorAll('[data-level]')].map(row=>({
   name:row.querySelector('[data-pack-name]').value,
   count:row.querySelector('[data-pack-count]').value,
   quantity:row.querySelector('[data-pack-opening]').value
 }));
 form.elements.packing.value=JSON.stringify(levels);
 try{
   const details=packingDetails(Object.fromEntries(new FormData(form)));
   form.elements.pack.value=details.pack;
   holder.querySelector('[data-conversion]').textContent=details.packing.map(level=>'1 '+level.name+' = '+level.units+' '+details.unit).join(' · ')||'Individual units only';
 }catch(error){holder.querySelector('[data-conversion]').textContent=error.message}
}
function qtyFields(){return input('Cartons','boxes','number',whole)+input('Loose units','units','number',whole)}
const fstr=(f,k)=>String(f.get(k)||'').trim();
const num=(f,k)=>Number(f.get(k)||0);
const paise=(f,k)=>Math.round(num(f,k)*100);
function makeProduct(f){
 const name=fstr(f,'name');
 if(!name)throw Error('Enter a product name.');
 const details=f.has('packing')?packingDetails(Object.fromEntries(f)):null;
 return {id:crypto.randomUUID(),name,...(details?{unit:details.unit,packing:details.packing,mrp:paise(f,'mrp')}:{}),barcode:fstr(f,'barcode'),pack:details?.pack??num(f,'pack'),carton:paise(f,'carton'),loose:paise(f,'loose'),hsn:fstr(f,'hsn'),tax:num(f,'tax'),stock:0,cost:0};
}
function addProduct(s,p){
 const clean = name=>name.toLowerCase().replace(/\s+/g,' ');
 if(s.products.some(x=>clean(x.name)===clean(p.name)||(p.barcode&&x.barcode===p.barcode)))throw Error('This product name or barcode already exists. Select the existing product.');
 s.products.push(p);
}
const productOptions=()=>[['','Select a product'],...data.products.map(p=>[p.id,p.name+(p.barcode?' · '+p.barcode:'')])];
const method=()=>select('Payment method','method',[['Cash','Cash'],['UPI','UPI'],['Bank','Bank']]);
const quantity=(f,p)=>num(f,'boxes')*p.pack+num(f,'units');
const entry=(s,type,fields)=>s.entries.push({id:s.next++,date:today(),type,...fields});
const byParty = value=>value.trim().toLowerCase().replace(/\s+/g,' ');
function balances(){
 const parties=new Map();
 for(const e of data.entries){
   if(!e.side)continue;
   const k=e.side+':'+(e.customerId?'id:'+e.customerId:'name:'+byParty(e.party));
   if(!parties.has(k))parties.set(k,{key:k,side:e.side,party:data.customers.find(row=>row.id===e.customerId)?.name||e.party,customerId:e.customerId,balance:0});
   parties.get(k).balance+=e.due;
 }
 return [...parties.values()];
}
function render(){
 const shortLabels={Orders:'Orders',Overview:'Today',Sale:'Sell',Purchase:'Receive',Stock:'Stock'};
 const navButton=(name,label,extra='')=>'<button type="button" data-page="'+name+'" class="'+extra+(page===name?' active':'')+'"'+(page===name?' aria-current="page"':'')+'>'+label+'</button>';
 const morePages=pages.filter(name=>!primaryPages.includes(name));
 document.querySelector('nav').innerHTML=pages.map(name=>navButton(name,shortLabels[name]||pageInfo[name][0],primaryPages.includes(name)?'':'secondary-nav')).join('')+
   '<button class="secondary-nav" data-logout>Sign out</button><button type="button" class="mobile-more'+(morePages.includes(page)?' active':'')+'" data-more aria-expanded="false" aria-controls="more-menu">More</button>'+
   '<div id="more-menu" hidden>'+morePages.map(name=>navButton(name,pageInfo[name][0])).join('')+'<button data-logout>Sign out</button></div>';
 let html='<h1>'+escape(invoice?'Demo invoice':pageInfo[page][0])+'</h1>';
 if(!invoice)html+='<p class="page-intro">'+pageInfo[page][1]+'</p>';
 if(invoice){view.innerHTML=html+invoiceView(invoice);return}
 if(page==='Overview'){
   const day=data.entries.filter(e=>e.date===today());
   const sales=day.filter(e=>e.type==='Sale').reduce((n,e)=>n+e.total,0);
   const cash=day.filter(e=>e.method==='Cash').reduce((n,e)=>n+e.flow,0);
   const incoming=day.reduce((n,e)=>n+Math.max(0,e.flow||0),0);
   const dues=balances().filter(x=>x.side==='Customer').reduce((n,x)=>n+x.balance,0);
   const payable=balances().filter(x=>x.side==='Supplier').reduce((n,x)=>n+x.balance,0);
   html+='<section class="workbench"><h2>'+escape(data.shop.name)+'</h2><div class="row"><button class="primary" data-page="Sale">New sale</button><button data-page="Purchase">Receive stock</button><button data-page="Orders">Area orders</button></div></section>'+
     '<div class="attention"><button data-page="Ledger">To collect from customers<strong>'+money(dues)+'</strong></button><button data-page="Ledger">To pay suppliers<strong>'+money(payable)+'</strong></button></div>'+

 for(const order of rows){

   for(const dispatch of order.dispatches){

       (dispatch.delivered?'':'<button data-deliver="'+escape(order.id)+'" data-entry="'+dispatch.entryId+'">Mark delivered</button>')+'</div></div>';

       available.map((line,i)=>line.available?'<fieldset><legend>'+escape(line.name)+'</legend><p>'+showQty(line.available,line.pack)+' available · '+money(line.cartonRate)+'/carton · '+money(line.looseRate)+'/unit</p><div class="fields">'+number('Send cartons','cartons'+i)+number('Send loose units','loose'+i)+'</div></fieldset>':'').join('')+

function displayStock(item){
 if(!item.packing)return Math.floor(item.stock/item.pack)+' cartons + '+item.stock%item.pack+' loose';
 let remaining=item.stock;
 const parts=[];
 for(const level of [...item.packing].reverse()){
   const quantity=Math.floor(remaining/level.units);
   if(quantity)parts.push(quantity+' '+level.name);
   remaining%=level.units;
 }
 if(remaining||!parts.length)parts.push(remaining+' '+item.unit);
 return parts.join(' + ');
}
function stockTable(query){
 const q=query.trim().toLowerCase();
 const matches=data.products.filter(p=>p.name.toLowerCase().includes(q)||p.barcode.toLowerCase().includes(q));
 if(!matches.length){
   document.querySelector('#stock').innerHTML='<p class="empty">'+(q?'No matching products.':'No items yet. Create one below or receive stock from Purchase.')+'</p>';
   return;
 }
 document.querySelector('#stock').innerHTML=table(['Product','Stock','Packing','MRP / unit','Selling / unit','Stock value'],matches.map(p=>[p.name,displayStock(p),(p.packing||[]).map(level=>level.name+' = '+level.units+' '+p.unit).join(' · ')||p.pack+' units per outer pack',money(p.mrp||0),money(p.loose),money(Math.round(p.stock*p.cost))]));
}

function calculateLine(f){
 const purchase=page==='Purchase', id=fstr(f,'product');
 const existing=product(data,id)||lines.find(l=>l.newProduct?.id===id)?.newProduct;
 const fresh=id==='new'?makeProduct(f):null;
 const p=fresh||existing;
 if(!p)throw Error('Select a product.');
 if(fresh)addProduct({products:[...data.products,...lines.flatMap(l=>l.newProduct?[l.newProduct]:[])]},fresh);
 const free=purchase?num(f,'freeBoxes')*p.pack+num(f,'freeUnits'):0;
 const count=quantity(f,p)+free;
 const base=purchase?paise(f,'cost'):num(f,'boxes')*p.carton+num(f,'units')*p.loose;
 return {id:p.id,name:p.name,hsn:p.hsn,boxes:num(f,'boxes'),units:num(f,'units'),quantity:count,base,tax:Math.round(base*p.tax/100),newProduct:fresh,fields:Object.fromEntries(f)};
}
function addLine(form){
 const line=calculateLine(form);
 if(line.quantity<1)throw Error('Enter at least one unit.');
 lines.push(line);
}
function updatePreviews(){
 const preview=document.querySelector('#line-preview');
 if(preview){
   const form=new FormData(preview.closest('form'));
   try{
     const line=calculateLine(form);
     const item=product(data,line.id);
     const available=item?.stock-lines.filter(row=>row.id===line.id).reduce((sum,row)=>sum+row.quantity,0);
     const stock=page==='Sale'&&item?' · '+available+' units available':'';
     const warning=page==='Sale'&&line.quantity>available?' · Insufficient stock':'';
     preview.textContent=line.quantity+' units'+stock+' · Line total '+money(line.base+line.tax)+warning;
   }catch{
     preview.textContent='Select a product to see the line total.';
   }
 }
 const balance=document.querySelector('#balance-preview');
 if(balance){
   const total=lines.reduce((sum,line)=>sum+line.base+line.tax,0);
   const form=balance.closest('form');
   const mode=form.elements.paymentStatus.value;
   const paidField=form.elements.paid;
   paidField.required=mode==='partial';
   paidField.closest('label').hidden=mode!=='partial';
   form.elements.method.closest('label').hidden=mode==='credit';
   const paid=mode==='full'?total:mode==='credit'?0:paise(new FormData(form),'paid');
   balance.textContent=paid>total?'Payment exceeds the bill total.':'Outstanding after payment '+money(total-paid);
 }
}

   row.innerHTML='<legend>Packing level '+(levels.children.length+1)+'</legend><div class="fields"><label>Pack name<input data-pack-name required maxlength="30" placeholder="Strip, box, carton"></label><label>How many of the unit below?<input data-pack-count required type="number" min="2" max="10000" step="1" value="10"></label><label '+(b.closest('[data-action=product]')?'hidden':'')+'>Opening packs at this level<input data-pack-opening required type="number" min="0" step="1" value="0"></label></div><button type="button" data-remove-pack>Remove this and higher levels</button>';
   levels.append(row);return;
 }
 if(b.hasAttribute('data-remove-pack')){
   itemReview=null;const review=view.querySelector('#item-review');if(review)review.hidden=true;
   const row=b.closest('[data-level]'), form=b.closest('form');
   while(row.nextElementSibling)row.nextElementSibling.remove();
   row.remove();syncPacking(form);return;
 }

 if(b.hasAttribute('data-more')){
   const menu=document.querySelector('#more-menu');
   menu.hidden=!menu.hidden;
   b.setAttribute('aria-expanded',String(!menu.hidden));
   return;
 }
 if(b.hasAttribute('data-logout')&&!saving){await signOut(auth);return}
 if(saving){status.textContent='Saving. Please wait.';return}
 if(saving&&(b.dataset.page||b.dataset.step||b.dataset.editCustomer||b.dataset.dueKey||b.dataset.remove!==undefined||b.dataset.invoice)){status.textContent='Saving. Please wait.';return}
 if(b.dataset.step){
   const form=view.querySelector('form[data-action="post"]');
   if(form)Object.assign(paymentDraft,Object.fromEntries(new FormData(form)));
   billStep=b.dataset.step;
   status.textContent='';
   render();
   view.querySelector('h1').scrollIntoView({block:'start'});
   return;
 }
 if(b.dataset.dueKey){
   duePayment=balances().find(row=>row.key===b.dataset.dueKey);
   render();
   view.querySelector('form[data-action="due"] input')?.focus();
   return;
 }
 if(b.dataset.editCustomer){editCustomerId=b.dataset.editCustomer;render();view.querySelector('[name=name]').focus();return}
 if(b.dataset.deliver){
   try{await send('delivered',{order:b.dataset.deliver,entry:b.dataset.entry});status.textContent='Delivery recorded.';render()}
   catch(error){status.textContent=error.message}
   return;
 }
 if(b.dataset.page)go(b.dataset.page);
 if(b.dataset.remove!==undefined){lines.splice(Number(b.dataset.remove),1);if(!lines.length)billStep='products';render()}
 if(b.dataset.invoice){invoice=data.entries.find(x=>x.id===Number(b.dataset.invoice));render()}
 if(b.hasAttribute('data-print'))window.print();

});
document.addEventListener('submit',async e=>{
 e.preventDefault();
 syncPacking(e.target);
 const f=new FormData(e.target), action=e.target.dataset.action;
 try{
   if(e.target===login)return;
   if(saving)throw Error('Saving. Please wait.');
   if(action==='party'){
     const customer=page==='Sale'?data.customers.find(row=>row.id===fstr(f,'customerId')):null;
     const party=page==='Sale'?customer?.name:fstr(f,'party');
     if(!party)throw Error('Enter a customer or supplier name.');
     paymentDraft.party=party;
     if(customer)paymentDraft.customerId=customer.id;
     billStep='products';status.textContent='';render();return;
   }
   if(action==='product'){
     if(itemReview!==JSON.stringify(Object.fromEntries(f)))throw Error('Review the item details before saving.');
     const previousIds=new Set(data.products.map(item=>item.id));
     await send('product',Object.fromEntries(f));
     const created=data.products.find(item=>!previousIds.has(item.id));
     if(created){savedItemId=created.id;itemMode='details'}
     itemReview=null;
     status.textContent='Item saved. Check its details below.';
     render();return;
   }
   if(action==='line')addLine(f);
   else{
     const fields=Object.fromEntries(f);
     if(action==='post'){
       const total=lines.reduce((sum,line)=>sum+line.base+line.tax,0);
       if(fields.paymentStatus==='partial'&&(paise(f,'paid')<=0||paise(f,'paid')>=total))throw Error('Part payment must be greater than zero and less than the bill total.');
       fields.paid=fields.paymentStatus==='full'?(total/100).toFixed(2):fields.paymentStatus==='credit'?'0':fields.paid;
       fields.party=paymentDraft.party;
       if(page==='Sale')fields.customerId=paymentDraft.customerId;
       delete fields.paymentStatus;
     }
     if(action==='due'){
       fields.party=duePayment.party;
       if(duePayment.customerId)fields.customerId=duePayment.customerId;
       fields.kind=duePayment.side==='Customer'?'collection':'supplier';
     }
     const entryId=await send(action==='due'?'payment':action,fields);
     if(action==='due')duePayment=null;
     if(action==='customer')editCustomerId='';
     if(action==='dispatch')invoice=data.entries.find(entry=>entry.id===entryId);
     if(action==='post'){
       if(page==='Sale')invoice=data.entries.find(entry=>entry.id===entryId);
       lines=[];billStep='party';paymentDraft={};
     }
   }
   status.textContent=action==='line'?'Product added.':action==='post'?(page==='Purchase'?'Purchase saved. Stock updated.':'Sale saved. Stock and dues updated.'):'Saved.';
   render();
 }catch(error){status.textContent=error.message}
});

</script>
